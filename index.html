<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chamada de Vídeo</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reset e Fontes estilo iOS/Telegram */
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100dvh; /* Altura dinâmica para mobile */
            overflow: hidden; 
            background-color: #000; 
            color: white;
            font-family: -apple-system, "SF Pro Text", "San Francisco", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none; 
            user-select: none;
        }

        /* Camada do Vídeo Remoto (Ocupa toda a tela ao fundo) */
        #remoteVideo {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            z-index: 1; 
            background: #1c1c1d; /* Fundo escuro para carregamento */
        }
        
        /* Camada do Vídeo Local (Picture-in-Picture) */
        #localVideo {
            position: absolute; 
            top: 16px; 
            right: 16px;
            width: 95px; 
            height: 140px;
            object-fit: cover; 
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 10; 
            background-color: #2b2b2b;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Overlay (Gradientes e Elementos de UI) */
        .overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 20;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            /* Gradiente sutil para garantir leitura do texto branco */
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; /* Permite clicar no vídeo se necessário */
        }

        /* Container dos Botões Inferiores */
        .controls-container {
            pointer-events: auto; 
            padding-bottom: 32px;
            display: flex; 
            justify-content: center; 
            gap: 32px;
            align-items: center; 
            width: 100%;
        }

        /* Estilo dos Botões (Glassmorphism) */
        .control-btn {
            width: 56px; 
            height: 56px; 
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: center; 
            align-items: center;
            border: none; 
            color: white; 
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
        }
        .control-btn:active { 
            background-color: rgba(255, 255, 255, 0.3); 
            transform: scale(0.95);
        }
        /* Estado Ativo (Fundo Branco, Ícone Preto) */
        .control-btn.active-state { 
            background-color: white; 
            color: black; 
        }
        
        /* Botão Encerrar (Vermelho) */
        .btn-end {
            width: 72px; 
            height: 72px;
            background-color: #FF3B30; /* Vermelho padrão iOS */
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }
        .btn-end:active { 
            background-color: #D63028; 
        }

        /* Telas de Status (Preview, Conectando, Fim) */
        .fullscreen-layer {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 50; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            background: #1c252f; /* Azul escuro padrão Telegram */
        }
        
        /* Avatar e Animação de Chamada (Ripple) */
        .avatar-box { 
            position: relative; 
            width: 120px; 
            height: 120px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .avatar {
            width: 100%; 
            height: 100%; 
            border-radius: 50%;
            background: linear-gradient(135deg, #50a7ea 0%, #3e92d3 100%);
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-size: 48px; 
            font-weight: 500; 
            color: white; 
            z-index: 2;
        }
        .ripple {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            border-radius: 50%; 
            background: rgba(80, 167, 234, 0.3);
            z-index: 1; 
            opacity: 0;
        }
        .animating { animation: ripple 2s infinite ease-out; }
        .ripple:nth-child(2) { animation-delay: 0.5s; }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Classes Utilitárias */
        .hidden { display: none !important; }
        .text-shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <!-- 1. TELA DE PREVIEW (Entrada) -->
    <div id="startScreen" class="fullscreen-layer bg-black">
        <div class="flex flex-col items-center w-full px-6 text-center">
            <div class="mb-6 w-24 h-24 rounded-full bg-gray-800 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2AABEE" stroke-width="1.5"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <h1 id="previewName" class="text-2xl font-semibold mb-2">Telegram Call</h1>
            <p class="text-gray-400 text-sm mb-10 px-4">Toque para entrar na chamada de vídeo criptografada de ponta-a-ponta.</p>
            
            <button id="btnJoin" class="w-full max-w-xs bg-[#2AABEE] hover:bg-[#2390c9] text-white font-medium py-3.5 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                <span>Atender Chamada</span>
            </button>
        </div>
    </div>

    <!-- 2. TELA DE STATUS (Conectando...) -->
    <div id="statusScreen" class="fullscreen-layer hidden">
        <div class="avatar-box">
            <div class="ripple"></div><div class="ripple"></div>
            <div class="avatar" id="avatarLetter">U</div>
        </div>
        <h2 id="statusName" class="text-2xl font-semibold mb-2">Usuário</h2>
        <p id="statusText" class="text-gray-300 text-base">A ligar...</p>

        <!-- Ações mostradas se falhar -->
        <div id="missedCallActions" class="hidden mt-12 flex flex-col items-center gap-4 animate-fade-in">
            <p class="text-white/60 text-sm">A chamada terminou ou expirou.</p>
            <button onclick="window.location.reload()" class="text-[#2AABEE] font-medium px-6 py-2 rounded-lg hover:bg-white/5 transition">
                Ligar Novamente
            </button>
        </div>
    </div>

    <!-- 3. INTERFACE DA CHAMADA (Ativa) -->
    <div id="callInterface" class="hidden w-full h-full relative bg-black">
        <!-- Vídeo Remoto (O vídeo que você configurou) -->
        <video id="remoteVideo" playsinline preload="auto">
            Seu navegador não suporta vídeo.
        </video>

        <!-- Vídeo Local (Câmera do usuário) -->
        <video id="localVideo" autoplay playsinline muted></video>

        <!-- Overlay de Interface -->
        <div class="overlay">
            <!-- Topo: Nome e Timer -->
            <div class="flex flex-col items-center mt-12 safe-area-top">
                <h3 id="callName" class="text-xl font-semibold text-shadow tracking-wide">Nome</h3>
                <span id="callTimer" class="text-sm font-normal text-white/90 text-shadow mt-1">00:00</span>
            </div>

            <!-- Rodapé: Botões de Controle -->
            <div class="controls-container safe-area-bottom">
                <!-- Mute -->
                <button class="control-btn" onclick="toggleMute()">
                    <svg id="iconMic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                
                <!-- Câmera On/Off -->
                <button class="control-btn" onclick="toggleCam()">
                    <svg id="iconCam" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </button>

                <!-- Inverter Câmera (Visual) -->
                <button class="control-btn" onclick="flipCamVisual()">
                     <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                </button>

                <!-- Encerrar Chamada -->
                <button class="control-btn btn-end" onclick="endCall(true)">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts de Lógica -->
    <script>
        // === 1. LEITURA DOS PARÂMETROS DA URL ===
        const urlParams = new URLSearchParams(window.location.search);
        
        // Configuração Padrão
        let config = { 
            name: "Usuário", 
            video: "", 
            expiry: null 
        };
        
        const dataParam = urlParams.get('d');
        let isExpired = false;

        // Decodificador de Base64 para JSON
        if (dataParam) {
            try {
                const decoded = JSON.parse(atob(dataParam));
                config.name = decoded.n || config.name;
                config.video = decoded.v || "";
                
                // Validação de Expiração
                if (decoded.e && new Date().getTime() > decoded.e) {
                    isExpired = true;
                }
            } catch (e) { 
                console.error("Link inválido ou corrompido."); 
            }
        }

        // Mapeamento dos elementos da UI
        const ui = {
            start: document.getElementById('startScreen'),
            status: document.getElementById('statusScreen'),
            call: document.getElementById('callInterface'),
            actions: document.getElementById('missedCallActions'),
            statusText: document.getElementById('statusText'),
            remoteVideo: document.getElementById('remoteVideo'),
            localVideo: document.getElementById('localVideo'),
            timer: document.getElementById('callTimer')
        };

        // Aplicação dos dados na interface
        document.getElementById('previewName').textContent = config.name;
        document.getElementById('statusName').textContent = config.name;
        document.getElementById('callName').textContent = config.name;
        document.getElementById('avatarLetter').textContent = config.name.charAt(0).toUpperCase();
        
        if (config.video) {
            ui.remoteVideo.src = config.video;
        }

        let callInterval;
        let seconds = 0;

        // === 2. EVENTOS DE INÍCIO ===

        // Botão "Atender Chamada"
        document.getElementById('btnJoin').addEventListener('click', async () => {
            // Tenta obter acesso à câmera do usuário
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                ui.localVideo.srcObject = stream;
            } catch (e) {
                console.warn("Câmera bloqueada ou indisponível. Continuando apenas com vídeo remoto.");
            }

            // Transição de tela
            ui.start.classList.add('hidden');
            ui.status.classList.remove('hidden');
            document.querySelectorAll('.ripple').forEach(r => r.classList.add('animating'));

            if (isExpired) {
                // Se link expirado, mostra erro após 3 segundos
                setTimeout(() => failCall("Chamada perdida"), 3000);
            } else {
                // Se válido, conecta em 2 segundos
                setTimeout(startCall, 2000);
            }
        });

        // Função para iniciar a vídeo chamada
        function startCall() {
            ui.status.classList.add('hidden');
            ui.call.classList.remove('hidden');
            
            // Inicia reprodução do vídeo
            const playPromise = ui.remoteVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay bloqueado. O vídeo iniciará após interação do usuário.");
                });
            }

            // Inicia contagem do tempo
            startTimer();
        }

        function startTimer() {
            callInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                ui.timer.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // === 3. FINALIZAÇÃO AUTOMÁTICA (IMPORTANTE) ===
        // Ouve o evento 'ended' do vídeo para encerrar a chamada
        ui.remoteVideo.addEventListener('ended', () => {
            console.log("Vídeo terminou. Encerrando chamada.");
            endCall(false); // false indica que não foi o usuário quem clicou
        });

        // === 4. CONTROLES ===
        
        function endCall(userAction) {
            clearInterval(callInterval);
            ui.remoteVideo.pause();
            
            ui.call.classList.add('hidden');
            ui.status.classList.remove('hidden');
            
            // Para as animações de ripple
            document.querySelectorAll('.ripple').forEach(r => r.classList.remove('animating'));
            
            failCall("Chamada terminada");
        }

        function failCall(msg) {
            ui.statusText.textContent = msg;
            ui.statusText.style.color = "#FF3B30"; // Cor de erro
            ui.actions.classList.remove('hidden');
            
            // Desliga a câmera local
            if (ui.localVideo.srcObject) {
                ui.localVideo.srcObject.getTracks().forEach(t => t.stop());
            }
        }

        function toggleMute() { 
            const el = document.getElementById('iconMic').parentNode; 
            el.classList.toggle('active-state');
            const icon = document.getElementById('iconMic');
            
            // Alterna ícone visualmente
            if(el.classList.contains('active-state')) {
                 icon.innerHTML = `<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>`;
            } else {
                 icon.innerHTML = `<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>`;
            }
        }
        
        function toggleCam() { 
            ui.localVideo.classList.toggle('opacity-0');
            const el = document.getElementById('iconCam').parentNode;
            el.classList.toggle('active-state');
        }

        function flipCamVisual() {
            ui.localVideo.style.transform = "scaleX(-1)";
            setTimeout(() => { ui.localVideo.style.transform = "scaleX(1)"; }, 200);
        }
    </script>
</body>
</html>
