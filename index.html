<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel FakeCall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        telegram: '#2AABEE',
                        darkbg: '#1c1c1d',
                        card: '#2c2c2e'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
        }
        .input-dark {
            background: #1c1c1d;
            border: 1px solid #3a3a3c;
            color: white;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #2AABEE;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-lg my-6 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-[#2AABEE] to-[#0088cc] rounded-full flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div>
            <h1 class="text-lg font-bold">Painel de Controle</h1>
            <p class="text-xs text-gray-500">Configuração de Chamada Bot</p>
        </div>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-lg space-y-4">
        
        <div class="bg-[#2c2c2e] p-6 rounded-2xl shadow-xl border border-gray-800">
            
            <!-- Nome -->
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Nome do Alvo</label>
                <input type="text" id="inputName" class="w-full input-dark p-3.5 rounded-xl text-sm" placeholder="Ex: Amor, Cliente..." value="Usuário">
            </div>

            <!-- Vídeo URL -->
            <div class="mb-2">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Link do Vídeo (MP4)</label>
                <div class="flex gap-2">
                    <input type="text" id="inputVideo" class="w-full input-dark p-3.5 rounded-xl text-sm" placeholder="Cole o link direto do vídeo aqui..." value="https://videos.pexels.com/video-files/4350035/4350035-sd_506_960_30fps.mp4">
                    <button onclick="checkVideo()" class="bg-[#3a3a3c] hover:bg-[#48484a] text-white px-4 rounded-xl transition-colors">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                </div>
            </div>

            <!-- Aviso sobre duração -->
            <div class="mb-6 bg-[#1c1c1d] p-3 rounded-lg border border-[#3a3a3c] flex items-start gap-3">
                <svg class="w-5 h-5 text-yellow-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-xs text-gray-400 leading-relaxed">
                    <strong class="text-gray-200">Duração Automática:</strong> A chamada encerrará automaticamente assim que o vídeo terminar. Certifique-se de usar um vídeo com a duração desejada.
                </p>
            </div>

            <!-- Validade do Link -->
            <div class="mb-6">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Link válido por</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="setTime(5)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="5">5 min</button>
                    <button type="button" onclick="setTime(30)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="30">30 min</button>
                    <button type="button" onclick="setTime(0)" class="time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg shadow-blue-500/20" data-val="0">Sempre</button>
                </div>
                <input type="hidden" id="inputTime" value="0">
            </div>

            <!-- Botão Gerar -->
            <button onclick="generateLink()" class="w-full bg-[#2AABEE] hover:bg-[#2390c9] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                Gerar Link da Chamada
            </button>
        </div>

        <!-- Preview Vídeo (Oculto até ativar) -->
        <div id="videoPreviewContainer" class="hidden rounded-xl overflow-hidden border border-gray-800 bg-black aspect-video relative shadow-2xl">
            <video id="videoPreview" class="w-full h-full object-contain" loop playsinline muted></video>
            <button onclick="closePreview()" class="absolute top-2 right-2 bg-black/60 p-1 rounded-full text-white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>

        <!-- Resultado -->
        <div id="resultArea" class="hidden animate-fade-in-up">
            <div class="bg-[#2c2c2e] rounded-xl p-4 border border-[#3a3a3c]">
                <p class="text-green-400 text-xs font-bold uppercase text-center mb-2">Link Gerado!</p>
                <div class="bg-[#1c1c1d] rounded-lg p-2 mb-3 flex items-center">
                    <input id="finalLink" class="w-full bg-transparent text-gray-300 text-xs focus:outline-none font-mono" readonly>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyLink()" id="btnCopy" class="flex-1 bg-[#3a3a3c] hover:bg-[#48484a] text-white py-2.5 rounded-lg text-xs font-medium transition-colors">Copiar</button>
                    <a id="btnTest" href="#" target="_blank" class="flex-1 bg-[#2AABEE] hover:bg-[#2390c9] text-white py-2.5 rounded-lg text-xs font-medium text-center transition-colors">Testar</a>
                </div>
            </div>
        </div>

    </main>

    <script>
        // === Lógica ===
        function setTime(mins) {
            document.getElementById('inputTime').value = mins;
            document.querySelectorAll('.time-btn').forEach(btn => {
                const val = parseInt(btn.getAttribute('data-val'));
                if (val === mins) {
                    btn.className = "time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg transition-all";
                } else {
                    btn.className = "time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 hover:bg-[#3a3a3c] transition-all";
                }
            });
        }

        const videoInput = document.getElementById('inputVideo');
        const videoPreview = document.getElementById('videoPreview');
        const previewContainer = document.getElementById('videoPreviewContainer');

        function checkVideo() {
            const url = videoInput.value.trim();
            if (!url) return;
            videoPreview.src = url;
            previewContainer.classList.remove('hidden');
            videoPreview.play().catch(e => console.log(e));
        }

        function closePreview() {
            previewContainer.classList.add('hidden');
            videoPreview.pause();
        }

        function generateLink() {
            const name = document.getElementById('inputName').value.trim() || "Usuário";
            const video = document.getElementById('inputVideo').value.trim();
            const mins = parseInt(document.getElementById('inputTime').value);
            
            if (!video) { alert("Insira o link do vídeo!"); return; }

            // Configuração de expiração do link (não da duração do vídeo)
            let expiryTime = null;
            if (mins > 0) expiryTime = new Date().getTime() + (mins * 60 * 1000);
            
            const data = { n: name, v: video, e: expiryTime };
            const base64Param = btoa(JSON.stringify(data));
            
            // Monta URL limpa
            const path = window.location.pathname;
            const dir = path.substring(0, path.lastIndexOf('/'));
            const baseUrl = (window.location.origin + dir).replace(/\/$/, "") + '/'; // Garante barra final
            
            const finalLink = `${baseUrl}?d=${base64Param}`;
            
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('finalLink').value = finalLink;
            document.getElementById('btnTest').href = finalLink;
        }

        function copyLink() {
            const copyText = document.getElementById("finalLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            const btn = document.getElementById('btnCopy');
            btn.textContent = "Copiado!";
            setTimeout(() => btn.textContent = "Copiar", 2000);
        }
    </script>
</body>
</html>
