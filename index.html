<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Telegram Font Stack & Reset */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background-color: #000; color: white;
            font-family: -apple-system, "SF Pro Text", "San Francisco", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none;
        }

        /* Camadas */
        #remoteVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; background: #1c1c1d;
        }
        
        /* PiP (Local Video) */
        #localVideo {
            position: absolute; 
            bottom: 120px; right: 16px;
            width: 95px; height: 140px;
            object-fit: cover; border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 30; background-color: #2b2b2b;
            transition: opacity 0.3s ease;
            cursor: grab;
            touch-action: none;
        }
        #localVideo:active { cursor: grabbing; }

        /* Overlay */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        /* Botões de Controle */
        .controls-container {
            pointer-events: auto; padding-bottom: 32px;
            display: flex; justify-content: center; gap: 32px;
            align-items: center; width: 100%;
        }
        .control-btn {
            width: 56px; height: 56px; border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            border: none; color: white; transition: background 0.2s;
            cursor: pointer;
        }
        .control-btn:active { background-color: rgba(255, 255, 255, 0.3); }
        .control-btn.active-state { background-color: white; color: black; }
        
        .btn-end {
            width: 72px; height: 72px;
            background-color: #FF3B30;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }
        .btn-end:active { background-color: #D63028; }

        /* Telas de Status */
        .fullscreen-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #1c252f;
        }
        
        /* Avatar & Ripple */
        .avatar-box { position: relative; width: 120px; height: 120px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, #50a7ea 0%, #3e92d3 100%);
            display: flex; justify-content: center; align-items: center;
            font-size: 48px; font-weight: 500; color: white; z-index: 2;
            /* Suporte para imagem de fundo */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .ripple {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: rgba(80, 167, 234, 0.3);
            z-index: 1; opacity: 0;
        }
        .animating { animation: ripple 2s infinite ease-out; }
        .ripple:nth-child(2) { animation-delay: 0.5s; }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .hidden { display: none !important; }
        .text-shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <!-- 1. Tela de Preview -->
    <div id="startScreen" class="fullscreen-layer bg-black">
        <div class="flex flex-col items-center w-full px-6 text-center">
            
            <!-- Avatar Inicial (Atualizado) -->
            <div class="mb-6 relative">
                <div id="startAvatar" class="w-28 h-28 rounded-full bg-gray-800 flex items-center justify-center bg-cover bg-center bg-no-repeat shadow-2xl border-2 border-[#1c1c1d] relative z-10">
                    <!-- Ícone Padrão (Fallback) -->
                    <svg id="startAvatarIcon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2AABEE" stroke-width="1.5"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
                    <!-- Letra Inicial (Fallback) -->
                    <span id="startAvatarLetter" class="text-4xl font-medium text-white hidden"></span>
                </div>
                <!-- Indicador Online (Bolinha Verde) -->
                <div class="absolute bottom-1 right-1 w-6 h-6 bg-[#4ade80] rounded-full border-4 border-[#1c252f] z-20 shadow-sm"></div>
            </div>

            <h1 id="previewName" class="text-2xl font-semibold mb-2">Telegram Call</h1>
            <p class="text-gray-400 text-sm mb-10 px-4">Toque para entrar na chamada de vídeo criptografada de ponta-a-ponta.</p>
            
            <button id="btnJoin" class="w-full max-w-xs bg-[#2AABEE] hover:bg-[#2390c9] text-white font-medium py-3.5 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                <span>Atender Chamada</span>
            </button>
        </div>
    </div>

    <!-- 2. Tela de Status (Conectando...) -->
    <div id="statusScreen" class="fullscreen-layer hidden">
        <div class="avatar-box">
            <div class="ripple"></div><div class="ripple"></div>
            <div class="avatar" id="avatarLetter">U</div>
        </div>
        <h2 id="statusName" class="text-2xl font-semibold mb-2">Usuário</h2>
        <p id="statusText" class="text-gray-300 text-base">A ligar...</p>

        <!-- Ações de Falha -->
        <div id="missedCallActions" class="hidden mt-12 flex flex-col items-center gap-4 animate-fade-in">
            <p class="text-white/60 text-sm">A chamada terminou ou expirou.</p>
            <button disabled class="text-gray-500 font-medium px-6 py-2 rounded-lg cursor-not-allowed border border-gray-700">
                Chamada Finalizada
            </button>
        </div>
    </div>

    <!-- 3. Interface da Chamada -->
    <div id="callInterface" class="hidden w-full h-full relative bg-black">
        <!-- Vídeo Remoto -->
        <video id="remoteVideo" playsinline preload="auto">
            Seu navegador não suporta vídeo.
        </video>

        <!-- Vídeo Local (Arrastável) -->
        <video id="localVideo" autoplay playsinline muted></video>

        <!-- Overlay -->
        <div class="overlay">
            <!-- Topo: Nome e Tempo -->
            <div class="flex flex-col items-center mt-12 safe-area-top">
                <h3 id="callName" class="text-xl font-semibold text-shadow tracking-wide">Nome</h3>
                <span id="callTimer" class="text-sm font-normal text-white/90 text-shadow mt-1">00:00</span>
            </div>

            <!-- Rodapé: Controles -->
            <div class="controls-container safe-area-bottom">
                <!-- Mute -->
                <button class="control-btn" onclick="toggleMute()">
                    <svg id="iconMic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                
                <!-- Camera -->
                <button class="control-btn" onclick="toggleCam()">
                    <svg id="iconCam" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </button>

                <!-- Flip (Visual) -->
                <button class="control-btn" onclick="flipCamVisual()">
                     <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                </button>

                <!-- Encerrar -->
                <button class="control-btn btn-end" onclick="endCall(true)">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURAÇÃO E LEITURA DO LINK ===
        const urlParams = new URLSearchParams(window.location.search);
        
        let config = { 
            name: "Usuário", 
            video: "", 
            avatar: "", 
            expiry: null 
        };
        
        const dataParam = urlParams.get('d');
        let isExpired = false;
        let callId = null;

        // Função segura para ler UTF-8 do Base64 (Suporte a Acentos/Emojis)
        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        if (dataParam) {
            try {
                callId = dataParam; 
                // Usa a nova função de descodificação
                const decoded = JSON.parse(b64_to_utf8(dataParam));
                config.name = decoded.n || config.name;
                config.video = decoded.v || "";
                config.avatar = decoded.a || ""; // LÊ O AVATAR DO LINK
                
                if (decoded.e && new Date().getTime() > decoded.e) {
                    isExpired = true;
                }
            } catch (e) { 
                console.error("Link inválido", e); 
            }
        }

        // Verifica bloqueio de reentrada
        if (callId && localStorage.getItem('call_ended_' + callId)) {
            isExpired = true;
        }

        const ui = {
            start: document.getElementById('startScreen'),
            status: document.getElementById('statusScreen'),
            call: document.getElementById('callInterface'),
            actions: document.getElementById('missedCallActions'),
            statusText: document.getElementById('statusText'),
            remoteVideo: document.getElementById('remoteVideo'),
            localVideo: document.getElementById('localVideo'),
            timer: document.getElementById('callTimer'),
            avatarLetter: document.getElementById('avatarLetter'),
            // Novos elementos da tela inicial
            startAvatar: document.getElementById('startAvatar'),
            startAvatarIcon: document.getElementById('startAvatarIcon'),
            startAvatarLetter: document.getElementById('startAvatarLetter')
        };

        // Popula interface
        document.getElementById('previewName').textContent = config.name;
        document.getElementById('statusName').textContent = config.name;
        document.getElementById('callName').textContent = config.name;
        
        // Lógica de Avatar: Configura tanto a tela de status quanto a inicial
        if (config.avatar) {
            // Tela de Status
            ui.avatarLetter.textContent = "";
            ui.avatarLetter.style.backgroundImage = `url('${config.avatar}')`;
            ui.avatarLetter.style.backgroundColor = "transparent";

            // Tela Inicial (Novo)
            ui.startAvatar.style.backgroundImage = `url('${config.avatar}')`;
            ui.startAvatar.style.backgroundColor = "transparent";
            ui.startAvatarIcon.style.display = "none";
            ui.startAvatarLetter.style.display = "none";
        } else {
            // Tela de Status (Padrão)
            ui.avatarLetter.textContent = config.name.charAt(0).toUpperCase();

            // Tela Inicial (Padrão - Gradiente Telegram)
            ui.startAvatar.style.background = "linear-gradient(135deg, #50a7ea 0%, #3e92d3 100%)";
            ui.startAvatarIcon.style.display = "none";
            ui.startAvatarLetter.textContent = config.name.charAt(0).toUpperCase();
            ui.startAvatarLetter.style.display = "block";
        }
        
        if (config.video) ui.remoteVideo.src = config.video;

        let callInterval;
        let seconds = 0;

        // --- LÓGICA DE ARRASTAR (Drag) ---
        const draggable = ui.localVideo;
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        draggable.addEventListener('mousedown', startDrag);
        draggable.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            e.preventDefault(); 
            isDragging = true;
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            const rect = draggable.getBoundingClientRect();
            if (!draggable.style.left) draggable.style.left = rect.left + 'px';
            if (!draggable.style.top) draggable.style.top = rect.top + 'px';
            draggable.style.bottom = 'auto';
            draggable.style.right = 'auto';
            initialLeft = parseFloat(draggable.style.left);
            initialTop = parseFloat(draggable.style.top);
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const dx = clientX - startX;
            const dy = clientY - startY;
            draggable.style.left = (initialLeft + dx) + 'px';
            draggable.style.top = (initialTop + dy) + 'px';
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        // --- EVENTOS DA CHAMADA ---
        document.getElementById('btnJoin').addEventListener('click', async () => {
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                ui.localVideo.srcObject = stream;
                setupAudioEcho(stream);
            } catch (e) { console.log("Sem câmara/microfone", e); }

            ui.start.classList.add('hidden');
            ui.status.classList.remove('hidden');
            document.querySelectorAll('.ripple').forEach(r => r.classList.add('animating'));

            if (isExpired) {
                setTimeout(() => failCall("Chamada terminada"), 1500);
            } else {
                setTimeout(startCall, 2000);
            }
        });

        // Configuração de ECO forte (500ms delay, 50% volume)
        function setupAudioEcho(stream) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            const delay = audioCtx.createDelay();
            delay.delayTime.value = 0.5; 
            const gain = audioCtx.createGain();
            gain.gain.value = 0.5; 
            source.connect(delay);
            delay.connect(gain);
            gain.connect(audioCtx.destination);
        }

        function startCall() {
            ui.status.classList.add('hidden');
            ui.call.classList.remove('hidden');
            const playPromise = ui.remoteVideo.play();
            if (playPromise !== undefined) playPromise.catch(e => console.log("Autoplay bloqueado"));
            startTimer();
        }

        function startTimer() {
            callInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                ui.timer.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        ui.remoteVideo.addEventListener('ended', () => {
            endCall(false); 
        });

        function endCall(userAction) {
            clearInterval(callInterval);
            ui.remoteVideo.pause();
            if (callId) {
                localStorage.setItem('call_ended_' + callId, 'true');
            }
            ui.call.classList.add('hidden');
            ui.status.classList.remove('hidden');
            document.querySelectorAll('.ripple').forEach(r => r.classList.remove('animating'));
            failCall("Chamada terminada");
        }

        function failCall(msg) {
            ui.statusText.textContent = msg;
            ui.statusText.style.color = "#FF3B30";
            ui.actions.classList.remove('hidden');
            if (ui.localVideo.srcObject) {
                ui.localVideo.srcObject.getTracks().forEach(t => t.stop());
            }
        }

        function toggleMute() { 
            document.getElementById('iconMic').parentNode.classList.toggle('active-state');
        }
        function toggleCam() { 
            ui.localVideo.classList.toggle('opacity-0');
            document.getElementById('iconCam').parentNode.classList.toggle('active-state');
        }
        function flipCamVisual() {
            ui.localVideo.style.transform = ui.localVideo.style.transform === "scaleX(-1)" ? "scaleX(1)" : "scaleX(-1)";
        }
    </script>
</body>
</html>
