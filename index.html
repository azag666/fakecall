<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Telegram Font Stack & Reset */
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; background-color: #000; color: white; font-family: -apple-system, "SF Pro Text", "San Francisco", BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; }

        /* MODOS DE EXIBIÇÃO */
        body.audio-mode { background: radial-gradient(circle at center, #1c2938 0%, #0f161e 100%); }
        /* CORREÇÃO ÁUDIO: Mantém o vídeo no DOM mas invisível para garantir playback de áudio */
        body.audio-mode #remoteVideo { opacity: 0; pointer-events: none; position: absolute; z-index: -1; } 
        body.audio-mode #localVideo { display: none; } /* Garante que vídeo local suma */
        body.audio-mode #activeCallAvatar { display: flex; } /* Mostra avatar */

        /* Camadas */
        #remoteVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #1c1c1d; }
        
        /* PiP (Local Video) */
        #localVideo { position: absolute; bottom: 120px; right: 16px; width: 95px; height: 140px; object-fit: cover; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 30; background-color: #2b2b2b; transition: opacity 0.3s ease; cursor: grab; touch-action: none; }
        #localVideo:active { cursor: grabbing; }

        /* AVATAR CENTRAL (Modo Áudio) */
        #activeCallAvatar {
            display: none; /* Padrão oculto */
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            z-index: 5;
            align-items: center; justify-content: center;
        }
        .active-avatar-img {
            width: 100%; height: 100%; border-radius: 50%; 
            background-size: cover; background-position: center;
            box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.7);
            animation: pulse-ring 2s infinite;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: bold; color: white;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(42, 171, 238, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(42, 171, 238, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(42, 171, 238, 0); }
        }

        /* Overlay */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.4) 100%); pointer-events: none; }

        /* Controles */
        .controls-container { pointer-events: auto; padding-bottom: 32px; display: flex; justify-content: center; gap: 32px; align-items: center; width: 100%; }
        .control-btn { width: 56px; height: 56px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); display: flex; justify-content: center; align-items: center; border: none; color: white; transition: background 0.2s; cursor: pointer; }
        .control-btn:active { background-color: rgba(255, 255, 255, 0.3); }
        .control-btn.active-state { background-color: white; color: black; }
        .btn-end { width: 72px; height: 72px; background-color: #FF3B30; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); }
        .btn-end:active { background-color: #D63028; }

        /* Status */
        .fullscreen-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c252f; }
        .avatar-box { position: relative; width: 120px; height: 120px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #50a7ea 0%, #3e92d3 100%); display: flex; justify-content: center; align-items: center; font-size: 48px; font-weight: 500; color: white; z-index: 2; background-size: cover; background-position: center; }
        .ripple { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: rgba(80, 167, 234, 0.3); z-index: 1; opacity: 0; }
        .animating { animation: ripple 2s infinite ease-out; } .ripple:nth-child(2) { animation-delay: 0.5s; }
        @keyframes ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.5); opacity: 0; } }
        .hidden { display: none !important; }
        .text-shadow { text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <!-- 1. Tela de Preview -->
    <div id="startScreen" class="fullscreen-layer bg-black">
        <div class="flex flex-col items-center w-full px-6 text-center">
            <div class="mb-6 relative">
                <div id="startAvatar" class="w-28 h-28 rounded-full bg-gray-800 flex items-center justify-center bg-cover bg-center bg-no-repeat shadow-2xl border-2 border-[#1c1c1d] relative z-10">
                    <svg id="startAvatarIcon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2AABEE" stroke-width="1.5"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
                    <span id="startAvatarLetter" class="text-4xl font-medium text-white hidden"></span>
                </div>
                <div class="absolute bottom-1 right-1 w-6 h-6 bg-[#4ade80] rounded-full border-4 border-[#1c252f] z-20 shadow-sm"></div>
            </div>
            <h1 id="previewName" class="text-2xl font-semibold mb-2">Telegram Call</h1>
            <p class="text-gray-400 text-sm mb-10 px-4">Toque para entrar na chamada.</p>
            <button id="btnJoin" class="w-full max-w-xs bg-[#2AABEE] hover:bg-[#2390c9] text-white font-medium py-3.5 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2"><span>Atender</span></button>
        </div>
    </div>

    <!-- 2. Tela de Status -->
    <div id="statusScreen" class="fullscreen-layer hidden">
        <div class="avatar-box"><div class="ripple"></div><div class="ripple"></div><div class="avatar" id="avatarLetter">U</div></div>
        <h2 id="statusName" class="text-2xl font-semibold mb-2">Usuário</h2>
        <p id="statusText" class="text-gray-300 text-base">A ligar...</p>
        <div id="missedCallActions" class="hidden mt-12 flex flex-col items-center gap-4 animate-fade-in">
            <p class="text-white/60 text-sm">A chamada terminou.</p>
            <button disabled class="text-gray-500 font-medium px-6 py-2 rounded-lg cursor-not-allowed border border-gray-700">Chamada Finalizada</button>
        </div>
    </div>

    <!-- 3. Interface da Chamada -->
    <div id="callInterface" class="hidden w-full h-full relative bg-black">
        
        <!-- ELEMENTOS DE MÍDIA -->
        <video id="remoteVideo" playsinline preload="auto">Seu navegador não suporta vídeo.</video>
        <div id="activeCallAvatar"><div class="active-avatar-img" id="activeAvatarImg"></div></div>
        <video id="localVideo" autoplay playsinline muted></video>

        <!-- UI -->
        <div class="overlay">
            <div class="flex flex-col items-center mt-12 safe-area-top">
                <h3 id="callName" class="text-xl font-semibold text-shadow tracking-wide">Nome</h3>
                <span id="callTimer" class="text-sm font-normal text-white/90 text-shadow mt-1">00:00</span>
            </div>
            <div class="controls-container safe-area-bottom">
                <button class="control-btn" onclick="toggleMute()"><svg id="iconMic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
                <button class="control-btn" id="btnCam" onclick="toggleCam()"><svg id="iconCam" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
                <button class="control-btn" id="btnFlip" onclick="flipCamVisual()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></button>
                <button class="control-btn btn-end" onclick="endCall(true)"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let config = { name: "Usuário", video: "", avatar: "", expiry: null, type: "video" };
        const dataParam = urlParams.get('d');
        let isExpired = false; let callId = null;

        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        if (dataParam) {
            try {
                callId = dataParam; 
                const decoded = JSON.parse(b64_to_utf8(dataParam));
                config.name = decoded.n || config.name;
                config.video = decoded.v || "";
                config.avatar = decoded.a || "";
                config.type = decoded.t || "video"; // Lê o tipo da chamada
                if (decoded.e && new Date().getTime() > decoded.e) isExpired = true;
            } catch (e) { console.error("Link inválido"); }
        }

        if (callId && localStorage.getItem('call_ended_' + callId)) isExpired = true;

        const ui = {
            start: document.getElementById('startScreen'),
            status: document.getElementById('statusScreen'),
            call: document.getElementById('callInterface'),
            actions: document.getElementById('missedCallActions'),
            statusText: document.getElementById('statusText'),
            remoteVideo: document.getElementById('remoteVideo'),
            localVideo: document.getElementById('localVideo'),
            timer: document.getElementById('callTimer'),
            avatarLetter: document.getElementById('avatarLetter'),
            startAvatar: document.getElementById('startAvatar'),
            startAvatarIcon: document.getElementById('startAvatarIcon'),
            startAvatarLetter: document.getElementById('startAvatarLetter'),
            activeAvatarImg: document.getElementById('activeAvatarImg') // Novo
        };

        // Aplica Configurações Iniciais
        document.getElementById('previewName').textContent = config.name;
        document.getElementById('statusName').textContent = config.name;
        document.getElementById('callName').textContent = config.name;
        
        // Configura Avatares
        if (config.avatar) {
            ui.avatarLetter.textContent = "";
            ui.avatarLetter.style.backgroundImage = `url('${config.avatar}')`;
            ui.avatarLetter.style.backgroundColor = "transparent";
            ui.startAvatar.style.backgroundImage = `url('${config.avatar}')`;
            ui.startAvatar.style.backgroundColor = "transparent";
            ui.startAvatarIcon.style.display = "none";
            ui.startAvatarLetter.style.display = "none";
            ui.activeAvatarImg.style.backgroundImage = `url('${config.avatar}')`;
            ui.activeAvatarImg.textContent = ""; // Remove letra
        } else {
            const letter = config.name.charAt(0).toUpperCase();
            ui.avatarLetter.textContent = letter;
            ui.startAvatar.style.background = "linear-gradient(135deg, #50a7ea 0%, #3e92d3 100%)";
            ui.startAvatarIcon.style.display = "none";
            ui.startAvatarLetter.textContent = letter;
            ui.startAvatarLetter.style.display = "block";
            ui.activeAvatarImg.style.backgroundColor = "#50a7ea";
            ui.activeAvatarImg.style.backgroundImage = "none";
            ui.activeAvatarImg.textContent = letter;
        }
        
        if (config.video) ui.remoteVideo.src = config.video;

        // Configuração de Modo Áudio
        if (config.type === 'audio') {
            document.body.classList.add('audio-mode');
            document.getElementById('btnCam').style.display = 'none';
            document.getElementById('btnFlip').style.display = 'none';
        }

        let callInterval; let seconds = 0;

        // DRAG LOGIC (Mantida)
        const draggable = ui.localVideo; let isDragging = false; let startX, startY, initialLeft, initialTop;
        draggable.addEventListener('mousedown', startDrag); draggable.addEventListener('touchstart', startDrag, { passive: false });
        function startDrag(e) { e.preventDefault(); isDragging = true; if (e.type === 'touchstart') { startX = e.touches[0].clientX; startY = e.touches[0].clientY; } else { startX = e.clientX; startY = e.clientY; } const rect = draggable.getBoundingClientRect(); if (!draggable.style.left) draggable.style.left = rect.left + 'px'; if (!draggable.style.top) draggable.style.top = rect.top + 'px'; draggable.style.bottom = 'auto'; draggable.style.right = 'auto'; initialLeft = parseFloat(draggable.style.left); initialTop = parseFloat(draggable.style.top); document.addEventListener('mousemove', drag); document.addEventListener('touchmove', drag, { passive: false }); document.addEventListener('mouseup', stopDrag); document.addEventListener('touchend', stopDrag); }
        function drag(e) { if (!isDragging) return; e.preventDefault(); let clientX, clientY; if (e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; } const dx = clientX - startX; const dy = clientY - startY; draggable.style.left = (initialLeft + dx) + 'px'; draggable.style.top = (initialTop + dy) + 'px'; }
        function stopDrag() { isDragging = false; document.removeEventListener('mousemove', drag); document.removeEventListener('touchmove', drag); document.removeEventListener('mouseup', stopDrag); document.removeEventListener('touchend', stopDrag); }

        // Chamada
        document.getElementById('btnJoin').addEventListener('click', async () => {
            // Lógica de Permissão de Mídia condicional
            let constraints = { audio: true, video: { facingMode: "user" } };
            
            // Se for modo áudio, pede APENAS áudio
            if (config.type === 'audio') {
                constraints = { audio: true, video: false };
            }

            try { 
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                // Só aplica ao elemento de vídeo se houver vídeo (modo video)
                if (config.type !== 'audio') {
                    ui.localVideo.srcObject = stream;
                }
                setupAudioEcho(stream);
            } catch (e) { console.log("Sem mídia autorizada", e); }

            ui.start.classList.add('hidden'); ui.status.classList.remove('hidden'); document.querySelectorAll('.ripple').forEach(r => r.classList.add('animating'));
            if (isExpired) setTimeout(() => failCall("Chamada terminada"), 1500); else setTimeout(startCall, 2000);
        });

        function setupAudioEcho(stream) {
            const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
            const audioCtx = new AudioContext(); const source = audioCtx.createMediaStreamSource(stream);
            const delay = audioCtx.createDelay(); delay.delayTime.value = 0.5; 
            const gain = audioCtx.createGain(); gain.gain.value = 0.5; 
            source.connect(delay); delay.connect(gain); gain.connect(audioCtx.destination);
        }

        function startCall() {
            ui.status.classList.add('hidden'); ui.call.classList.remove('hidden');
            const playPromise = ui.remoteVideo.play(); if (playPromise !== undefined) playPromise.catch(e => console.log("Autoplay blocked"));
            startTimer();
        }

        function startTimer() { callInterval = setInterval(() => { seconds++; const mins = Math.floor(seconds / 60).toString().padStart(2, '0'); const secs = (seconds % 60).toString().padStart(2, '0'); ui.timer.textContent = `${mins}:${secs}`; }, 1000); }

        ui.remoteVideo.addEventListener('ended', () => { endCall(false); });

        function endCall(userAction) { clearInterval(callInterval); ui.remoteVideo.pause(); if (callId) localStorage.setItem('call_ended_' + callId, 'true'); ui.call.classList.add('hidden'); ui.status.classList.remove('hidden'); document.querySelectorAll('.ripple').forEach(r => r.classList.remove('animating')); failCall("Chamada terminada"); }
        function failCall(msg) { ui.statusText.textContent = msg; ui.statusText.style.color = "#FF3B30"; ui.actions.classList.remove('hidden'); if (ui.localVideo.srcObject) ui.localVideo.srcObject.getTracks().forEach(t => t.stop()); }
        function toggleMute() { document.getElementById('iconMic').parentNode.classList.toggle('active-state'); }
        function toggleCam() { ui.localVideo.classList.toggle('opacity-0'); document.getElementById('iconCam').parentNode.classList.toggle('active-state'); }
        function flipCamVisual() { ui.localVideo.style.transform = ui.localVideo.style.transform === "scaleX(-1)" ? "scaleX(1)" : "scaleX(-1)"; }
    </script>
</body>
</html>
