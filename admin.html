<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel FakeCall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        telegram: '#2AABEE',
                        darkbg: '#1c1c1d',
                        card: '#2c2c2e'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
        }
        .input-dark {
            background: #1c1c1d;
            border: 1px solid #3a3a3c;
            color: white;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #2AABEE;
            outline: none;
        }
        /* Animação de Loading */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #2AABEE;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-lg my-6 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-[#2AABEE] to-[#0088cc] rounded-full flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div>
            <h1 class="text-lg font-bold">Painel de Controle</h1>
            <p class="text-xs text-gray-500">Configuração de Chamada Bot</p>
        </div>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-lg space-y-4">
        
        <div class="bg-[#2c2c2e] p-6 rounded-2xl shadow-xl border border-gray-800">
            
            <!-- Nome -->
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Nome do Alvo</label>
                <input type="text" id="inputName" class="w-full input-dark p-3.5 rounded-xl text-sm" placeholder="Ex: Amor, Cliente..." value="Usuário">
            </div>

            <!-- UPLOAD DE VÍDEO -->
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Arquivo de Vídeo</label>
                
                <!-- Área de Drop / Upload -->
                <div class="relative group">
                    <div id="dropZone" class="border-2 border-dashed border-[#3a3a3c] rounded-xl p-6 text-center hover:border-[#2AABEE] hover:bg-[#2AABEE]/5 transition-colors cursor-pointer relative bg-[#1c1c1d]">
                        <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        
                        <!-- Conteúdo Inicial -->
                        <div id="uploadContent" class="flex flex-col items-center pointer-events-none">
                            <div class="w-12 h-12 bg-[#2c2c2e] rounded-full flex items-center justify-center mb-3 group-hover:bg-[#3a3a3c] transition-colors border border-[#3a3a3c]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2AABEE" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </div>
                            <p class="text-sm text-gray-300 font-medium">Toque para selecionar vídeo</p>
                            <p class="text-[10px] text-gray-500 mt-1">MP4, MOV ou WebM</p>
                        </div>

                        <!-- Estado de Loading -->
                        <div id="uploadLoading" class="hidden flex-col items-center justify-center py-2">
                            <div class="loader mb-3"></div>
                            <p class="text-xs text-[#2AABEE] font-medium animate-pulse">Enviando para nuvem...</p>
                            <p class="text-[10px] text-gray-500 mt-1">Isso pode levar alguns segundos</p>
                        </div>
                    </div>
                </div>

                <!-- Input URL (Preenchido automaticamente) -->
                <div class="mt-3 flex gap-2">
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        </div>
                        <input type="text" id="inputVideo" class="w-full input-dark pl-9 p-3 rounded-lg text-xs text-gray-300 truncate" placeholder="Link do vídeo aparecerá aqui..." readonly>
                    </div>
                    <button onclick="checkVideo()" class="bg-[#3a3a3c] hover:bg-[#48484a] text-white px-3 rounded-lg transition-colors border border-gray-700" title="Verificar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                </div>
            </div>

            <!-- Aviso -->
            <div class="mb-6 bg-[#1c1c1d]/50 p-3 rounded-lg border border-[#3a3a3c] flex items-start gap-3">
                <svg class="w-5 h-5 text-yellow-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-xs text-gray-400 leading-relaxed">
                    <strong class="text-gray-200">Duração Automática:</strong> A chamada encerrará automaticamente assim que o vídeo terminar.
                </p>
            </div>

            <!-- Validade -->
            <div class="mb-6">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Link válido por</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="setTime(5)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="5">5 min</button>
                    <button type="button" onclick="setTime(30)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="30">30 min</button>
                    <button type="button" onclick="setTime(0)" class="time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg shadow-blue-500/20" data-val="0">Sempre</button>
                </div>
                <input type="hidden" id="inputTime" value="0">
            </div>

            <!-- Botão Gerar -->
            <button onclick="generateLink()" class="w-full bg-[#2AABEE] hover:bg-[#2390c9] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                Gerar Link da Chamada
            </button>
        </div>

        <!-- Preview (Oculto) -->
        <div id="videoPreviewContainer" class="hidden rounded-xl overflow-hidden border border-gray-800 bg-black aspect-video relative shadow-2xl mt-4">
            <video id="videoPreview" class="w-full h-full object-contain" loop playsinline muted></video>
            <button onclick="closePreview()" class="absolute top-2 right-2 bg-black/60 p-1.5 rounded-full text-white hover:bg-black/80"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>

        <!-- Resultado -->
        <div id="resultArea" class="hidden animate-fade-in-up mt-4">
            <div class="bg-[#2c2c2e] rounded-xl p-4 border border-[#3a3a3c]">
                <p class="text-green-400 text-xs font-bold uppercase text-center mb-2">Link Gerado com Sucesso!</p>
                <div class="bg-[#1c1c1d] rounded-lg p-2 mb-3 flex items-center border border-[#3a3a3c]">
                    <input id="finalLink" class="w-full bg-transparent text-gray-300 text-xs focus:outline-none font-mono" readonly>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyLink()" id="btnCopy" class="flex-1 bg-[#3a3a3c] hover:bg-[#48484a] text-white py-2.5 rounded-lg text-xs font-medium transition-colors border border-gray-700">Copiar</button>
                    <a id="btnTest" href="#" target="_blank" class="flex-1 bg-[#2AABEE] hover:bg-[#2390c9] text-white py-2.5 rounded-lg text-xs font-medium text-center transition-colors shadow-lg shadow-blue-500/20">Testar</a>
                </div>
            </div>
        </div>

    </main>

    <script>
        // === LÓGICA DE UPLOAD ===
        const fileInput = document.getElementById('fileInput');
        const uploadContent = document.getElementById('uploadContent');
        const uploadLoading = document.getElementById('uploadLoading');
        const inputVideo = document.getElementById('inputVideo');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 1. UI: Mostrar Loading
            uploadContent.classList.add('hidden');
            uploadLoading.classList.remove('hidden');
            uploadLoading.classList.add('flex');

            try {
                // 2. Pedir URL assinada para nossa API Vercel
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: file.name, filetype: file.type })
                });

                if (!res.ok) throw new Error('Erro ao conectar com API de upload');
                
                const { uploadUrl, publicUrl } = await res.json();

                // 3. Fazer Upload direto para o Cloudflare/R2
                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file,
                    headers: { 'Content-Type': file.type }
                });

                if (!uploadRes.ok) throw new Error('Falha no envio do arquivo');

                // 4. Sucesso: Preencher input e mostrar preview
                inputVideo.value = publicUrl;
                checkVideo();
                
            } catch (err) {
                alert('Erro: ' + err.message);
                console.error(err);
            } finally {
                // 5. UI: Resetar estado
                uploadLoading.classList.add('hidden');
                uploadLoading.classList.remove('flex');
                uploadContent.classList.remove('hidden');
                fileInput.value = ''; // Limpa input para permitir re-upload do mesmo arquivo
            }
        });

        // === OUTRAS FUNÇÕES (Time, Generate, Copy) ===
        function setTime(mins) {
            document.getElementById('inputTime').value = mins;
            document.querySelectorAll('.time-btn').forEach(btn => {
                const val = parseInt(btn.getAttribute('data-val'));
                if (val === mins) {
                    btn.className = "time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg transition-all";
                } else {
                    btn.className = "time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 hover:bg-[#3a3a3c] transition-all";
                }
            });
        }

        const videoPreview = document.getElementById('videoPreview');
        const previewContainer = document.getElementById('videoPreviewContainer');

        function checkVideo() {
            const url = inputVideo.value.trim();
            if (!url) return;
            videoPreview.src = url;
            previewContainer.classList.remove('hidden');
            // Tenta dar play para confirmar que funciona
            videoPreview.play().catch(e => console.log("Preview aguardando interação"));
        }

        function closePreview() {
            previewContainer.classList.add('hidden');
            videoPreview.pause();
        }

        function generateLink() {
            const name = document.getElementById('inputName').value.trim() || "Usuário";
            const video = inputVideo.value.trim();
            const mins = parseInt(document.getElementById('inputTime').value);
            
            if (!video) { alert("Por favor, faça o upload de um vídeo primeiro!"); return; }

            let expiryTime = null;
            if (mins > 0) expiryTime = new Date().getTime() + (mins * 60 * 1000);
            
            const data = { n: name, v: video, e: expiryTime };
            const base64Param = btoa(JSON.stringify(data));
            
            // Corrige URL base para remover 'admin.html'
            const path = window.location.pathname;
            const dir = path.substring(0, path.lastIndexOf('/'));
            const baseUrl = (window.location.origin + dir).replace(/\/$/, "") + '/';
            
            const finalLink = `${baseUrl}?d=${base64Param}`;
            
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('finalLink').value = finalLink;
            document.getElementById('btnTest').href = finalLink;
            
            // Scroll até o resultado
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        function copyLink() {
            const copyText = document.getElementById("finalLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            const btn = document.getElementById('btnCopy');
            const originalText = btn.textContent;
            btn.textContent = "Copiado!";
            btn.classList.add('bg-green-600', 'border-green-600');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('bg-green-600', 'border-green-600');
            }, 2000);
        }
    </script>
</body>
</html>
