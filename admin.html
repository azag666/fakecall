<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel FakeCall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        telegram: '#2AABEE',
                        darkbg: '#1c1c1d',
                        card: '#2c2c2e'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
        }
        .input-dark {
            background: #1c1c1d;
            border: 1px solid #3a3a3c;
            color: white;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #2AABEE;
            outline: none;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #2AABEE;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-lg my-6 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-[#2AABEE] to-[#0088cc] rounded-full flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15.6 2.7a10 10 0 1 0 5.7 5.7"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div>
            <h1 class="text-lg font-bold">Painel de Controle</h1>
            <p class="text-xs text-gray-500">Configuração de Chamada Bot</p>
        </div>
    </header>

    <!-- Main Card -->
    <main class="w-full max-w-lg space-y-4">
        
        <div class="bg-[#2c2c2e] p-6 rounded-2xl shadow-xl border border-gray-800">
            
            <!-- 1. FOTO DE PERFIL -->
            <div class="mb-5 flex items-center gap-4">
                <div class="relative w-20 h-20 flex-shrink-0">
                    <!-- Preview da Imagem -->
                    <div id="avatarPreview" class="w-full h-full rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center overflow-hidden border-2 border-[#3a3a3c]">
                        <span class="text-2xl font-bold text-white">?</span>
                        <img id="avatarImg" class="absolute inset-0 w-full h-full object-cover hidden" />
                    </div>
                    <!-- Botão de Upload Pequeno -->
                    <label class="absolute bottom-0 right-0 bg-[#2AABEE] hover:bg-[#2390c9] text-white p-1.5 rounded-full cursor-pointer shadow-lg transition-transform active:scale-90">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <input type="file" id="avatarInput" accept="image/*" class="hidden">
                    </label>
                    <!-- Loading da Imagem -->
                    <div id="avatarLoading" class="absolute inset-0 bg-black/50 rounded-full hidden items-center justify-center">
                        <div class="loader w-6 h-6 border-2"></div>
                    </div>
                </div>
                
                <div class="flex-1">
                    <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Nome de Exibição</label>
                    <input type="text" id="inputName" class="w-full input-dark p-3.5 rounded-xl text-sm font-medium" placeholder="Ex: Suporte Telegram" value="Suporte">
                    <input type="hidden" id="inputAvatarUrl"> <!-- URL da foto salva aqui -->
                </div>
            </div>

            <hr class="border-[#3a3a3c] my-6">

            <!-- 2. UPLOAD DE VÍDEO -->
            <div class="mb-5">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Vídeo da Chamada</label>
                
                <div class="relative group">
                    <div id="dropZone" class="border-2 border-dashed border-[#3a3a3c] rounded-xl p-6 text-center hover:border-[#2AABEE] hover:bg-[#2AABEE]/5 transition-colors cursor-pointer relative bg-[#1c1c1d]">
                        <input type="file" id="videoInput" accept="video/mp4,video/webm,video/quicktime" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        
                        <div id="videoUploadContent" class="flex flex-col items-center pointer-events-none">
                            <div class="w-12 h-12 bg-[#2c2c2e] rounded-full flex items-center justify-center mb-3 group-hover:bg-[#3a3a3c] transition-colors border border-[#3a3a3c]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2AABEE" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </div>
                            <p class="text-sm text-gray-300 font-medium">Toque para selecionar vídeo</p>
                        </div>

                        <div id="videoUploadLoading" class="hidden flex-col items-center justify-center py-2">
                            <div class="loader mb-3"></div>
                            <p class="text-xs text-[#2AABEE] font-medium animate-pulse">Enviando vídeo...</p>
                        </div>
                    </div>
                </div>

                <!-- Input URL Video -->
                <div class="mt-3 relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="text" id="inputVideo" class="w-full input-dark pl-9 p-3 rounded-lg text-xs text-gray-300 truncate" placeholder="Link do vídeo..." >
                </div>
            </div>

            <!-- 3. CONFIGURAÇÕES FINAIS -->
            <div class="mb-6">
                <label class="block text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2 ml-1">Expiração do Link</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="setTime(5)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="5">5 min</button>
                    <button type="button" onclick="setTime(30)" class="time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 transition-all hover:bg-[#3a3a3c]" data-val="30">30 min</button>
                    <button type="button" onclick="setTime(0)" class="time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg shadow-blue-500/20" data-val="0">Sempre</button>
                </div>
                <input type="hidden" id="inputTime" value="0">
            </div>

            <!-- BOTÃO GERAR -->
            <button onclick="generateLink()" class="w-full bg-[#2AABEE] hover:bg-[#2390c9] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                Gerar Link da Chamada
            </button>
        </div>

        <!-- RESULTADO -->
        <div id="resultArea" class="hidden animate-fade-in-up mt-4 mb-10">
            <div class="bg-[#2c2c2e] rounded-xl p-4 border border-[#3a3a3c]">
                <p class="text-green-400 text-xs font-bold uppercase text-center mb-2">Link Gerado!</p>
                <div class="bg-[#1c1c1d] rounded-lg p-2 mb-3 flex items-center border border-[#3a3a3c]">
                    <input id="finalLink" class="w-full bg-transparent text-gray-300 text-xs focus:outline-none font-mono" readonly>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyLink()" id="btnCopy" class="flex-1 bg-[#3a3a3c] hover:bg-[#48484a] text-white py-2.5 rounded-lg text-xs font-medium transition-colors border border-gray-700">Copiar</button>
                    <a id="btnTest" href="#" target="_blank" class="flex-1 bg-[#2AABEE] hover:bg-[#2390c9] text-white py-2.5 rounded-lg text-xs font-medium text-center transition-colors shadow-lg shadow-blue-500/20">Testar</a>
                </div>
            </div>
        </div>

    </main>

    <script>
        // === FUNÇÃO DE UPLOAD GENÉRICA ===
        async function uploadFile(file) {
            // 1. Pedir URL assinada
            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: file.name, filetype: file.type })
            });

            if (!res.ok) throw new Error('Erro na API de upload');
            const { uploadUrl, publicUrl } = await res.json();

            // 2. Upload para Cloudflare
            const uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: { 'Content-Type': file.type }
            });

            if (!uploadRes.ok) throw new Error('Erro no envio para Cloudflare');
            return publicUrl;
        }

        // === UPLOAD DA FOTO DE PERFIL ===
        const avatarInput = document.getElementById('avatarInput');
        const avatarLoading = document.getElementById('avatarLoading');
        const avatarImg = document.getElementById('avatarImg');
        const inputAvatarUrl = document.getElementById('inputAvatarUrl');

        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            avatarLoading.classList.remove('hidden');
            avatarLoading.classList.add('flex');

            try {
                const url = await uploadFile(file);
                inputAvatarUrl.value = url;
                avatarImg.src = url;
                avatarImg.classList.remove('hidden');
            } catch (err) {
                alert('Erro ao enviar imagem: ' + err.message);
            } finally {
                avatarLoading.classList.add('hidden');
                avatarLoading.classList.remove('flex');
            }
        });

        // === UPLOAD DE VÍDEO ===
        const videoInput = document.getElementById('videoInput');
        const videoContent = document.getElementById('videoUploadContent');
        const videoLoading = document.getElementById('videoUploadLoading');
        const inputVideo = document.getElementById('inputVideo');

        videoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            videoContent.classList.add('hidden');
            videoLoading.classList.remove('hidden');
            videoLoading.classList.add('flex');

            try {
                const url = await uploadFile(file);
                inputVideo.value = url;
            } catch (err) {
                alert('Erro ao enviar vídeo: ' + err.message);
                videoContent.classList.remove('hidden');
            } finally {
                videoLoading.classList.add('hidden');
                videoLoading.classList.remove('flex');
            }
        });

        // === GERAR LINK ===
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        function generateLink() {
            try {
                const name = document.getElementById('inputName').value.trim() || "Usuário";
                const video = inputVideo.value.trim();
                const avatar = inputAvatarUrl.value.trim();
                const mins = parseInt(document.getElementById('inputTime').value);
                
                if (!video) { alert("O vídeo é obrigatório!"); return; }

                let expiryTime = null;
                if (mins > 0) expiryTime = new Date().getTime() + (mins * 60 * 1000);
                
                const data = { 
                    n: name, 
                    v: video, 
                    a: avatar, 
                    e: expiryTime 
                };
                
                // Usa função segura para acentos e emojis
                const base64Param = utf8_to_b64(JSON.stringify(data));
                
                const path = window.location.pathname;
                const dir = path.substring(0, path.lastIndexOf('/'));
                const baseUrl = (window.location.origin + dir).replace(/\/$/, "") + '/';
                
                const finalLink = `${baseUrl}?d=${base64Param}`;
                
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('finalLink').value = finalLink;
                document.getElementById('btnTest').href = finalLink;
                document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert("Erro ao gerar link: " + err.message);
                console.error(err);
            }
        }

        // === UTILITÁRIOS ===
        function setTime(mins) {
            document.getElementById('inputTime').value = mins;
            document.querySelectorAll('.time-btn').forEach(btn => {
                const val = parseInt(btn.getAttribute('data-val'));
                if (val === mins) {
                    btn.className = "time-btn bg-[#2AABEE] border border-[#2AABEE] py-2.5 rounded-lg text-xs text-white font-medium shadow-lg transition-all";
                } else {
                    btn.className = "time-btn bg-[#1c1c1d] border border-[#3a3a3c] py-2.5 rounded-lg text-xs text-gray-300 hover:bg-[#3a3a3c] transition-all";
                }
            });
        }

        function copyLink() {
            const copyText = document.getElementById("finalLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            const btn = document.getElementById('btnCopy');
            btn.textContent = "Copiado!";
            setTimeout(() => btn.textContent = "Copiar", 2000);
        }
    </script>
</body>
</html>
